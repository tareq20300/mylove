<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            position: relative;
            width: min(90vw, 650px);
            height: min(80vh, 600px);
        }

        .love {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: clamp(10px, 1.5vw, 16px);
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            animation: appear 0.7s ease forwards;
            user-select: none;
        }

        .blue {
            color: #00aaff;
            text-shadow:
                0 0 5px #008cff,
                0 0 12px #008cff,
                0 0 25px #0077ff;
        }

        .pink {
            color: #ff4fa3;
            text-shadow:
                0 0 5px #ff168c,
                0 0 12px #ff168c,
                0 0 25px #ff168c;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: bold;
            text-align: center;
            opacity: 0;
            animation: centerAppear 1.5s ease forwards;
            animation-delay: 5s;
            text-shadow:
                0 0 10px #ff4fa3,
                0 0 25px #008cff;
            white-space: nowrap;
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes centerAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @media (max-width: 480px) {
            .heart {
                width: 96vw;
                height: 65vh;
            }

            .love {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="heart" id="heart"></div>
        <div class="message">I Love You</div>
    </div>

    <script>
        const heart = document.getElementById("heart");

        const total = 150;
        const width = 100;
        const height = 90;

        for (let i = 0; i < total; i++) {
            const t = (i / total) * Math.PI * 2;

            const x = 16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t);

            const text = document.createElement("span");

            text.className = "love";

            text.textContent = "Love You";

            text.style.left = `${50 + (x / 32) * width}%`;
            text.style.top = `${50 - (y / 30) * height}%`;

            text.style.animationDelay = `${i * 0.035}s`;

            text.classList.add(x < 0 ? "blue" : "pink");

            heart.appendChild(text);
        }
    </script>
</body>
</html>
